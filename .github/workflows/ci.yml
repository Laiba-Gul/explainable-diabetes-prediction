name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests (hermetic, synthetic data)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Smoke test on real data (checksum-verified download + PIMA CV)
        run: |
          diabetes-xai download pima
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("configs/pima_cv.yaml"))
          cfg["cv"] = {"n_splits": 3, "n_repeats": 1}
          cfg["models"] = {k: v for k, v in cfg["models"].items() if k in ("Logistic Regression", "LightGBM")}
          cfg["experiment"] = "pima_cv_smoke"
          yaml.safe_dump(cfg, open("/tmp/pima_smoke.yaml", "w"))
          PY
          diabetes-xai --results-dir /tmp/results train /tmp/pima_smoke.yaml

  docker:
    name: Build & smoke-test Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (downloads BRFSS + trains the served model)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: diabetes-xai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and call the API
        run: |
          docker run -d --name api -p 8000:8000 diabetes-xai:ci
          for i in $(seq 1 40); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health
          curl -sf -X POST "http://localhost:8000/predict?explain=true" -H "Content-Type: application/json" \
            -d '{"HighBP":1,"HighChol":1,"CholCheck":1,"BMI":31,"Smoker":0,"Stroke":0,"HeartDiseaseorAttack":0,"PhysActivity":1,"Fruits":1,"Veggies":1,"HvyAlcoholConsump":0,"AnyHealthcare":1,"NoDocbcCost":0,"GenHlth":3,"MentHlth":0,"PhysHlth":5,"DiffWalk":0,"Sex":0,"Age":9,"Education":5,"Income":6}'
          docker logs api
      - name: Stop container
        if: always()
        run: docker rm -f api || true
