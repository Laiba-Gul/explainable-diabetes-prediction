[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-xai"
version = "1.0.0"
description = "Explainable, reproducible diabetes risk prediction on BRFSS 2015 and PIMA, with model serving"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Laiba Gul" }]
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.6", "imbalanced-learn>=0.13",
  "xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2.7", "shap>=0.46", "matplotlib>=3.9",
  "pyyaml>=6.0", "joblib>=1.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
diabetes-xai = "diabetes_xai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["diabetes_xai"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "N803", "N806"]
