# Reproduces notebook "Early_Diabetes_BRFSS_Ensemble_Memory_Safe_Colab" and
# produces the SERVED model. Natural prevalence (no resampling), all 21 features,
# five tree learners, a validation-weighted soft-voting ensemble and an
# out-of-fold stacking ensemble. Thresholds: accuracy-optimal on validation
# (as in the notebook). The exported API model is the best single tree model
# (by validation ROC-AUC) with an F1-optimal validation threshold for screening.
#
# Deviation from the notebook: ExtraTrees uses 300 trees instead of 700 so the
# run fits in 7 GB RAM (it received only 1.4% of the voting weight originally).
experiment: brfss_ensemble
title: BRFSS 2015, natural prevalence
dataset: brfss
seed: 42
model_version: "1.0.0"
feature_selection: {method: all}
balance: {method: none}
threshold_policy: accuracy
selection_metric: roc_auc
bootstrap: 300
serve: {only_tree_models: true, threshold_policy: f1}
models:
  Logistic Regression: {type: logistic_regression, family: Machine Learning, params: {max_iter: 3000, C: 0.5}}
  ExtraTrees: {type: extra_trees, params: {n_estimators: 300, max_features: 0.8, min_samples_leaf: 2, n_jobs: 2}}
  HistGradientBoosting: {type: hist_gb, params: {learning_rate: 0.06, max_iter: 400, max_leaf_nodes: 23, min_samples_leaf: 30, l2_regularization: 2.0, early_stopping: true}}
  XGBoost: {type: xgboost, params: {n_estimators: 900, learning_rate: 0.035, max_depth: 5, min_child_weight: 8, subsample: 0.85, colsample_bytree: 0.9, reg_alpha: 0.05, reg_lambda: 3.0, n_jobs: 2}}
  LightGBM: {type: lightgbm, params: {n_estimators: 1000, learning_rate: 0.03, num_leaves: 31, min_child_samples: 40, subsample: 0.85, colsample_bytree: 0.85, reg_alpha: 0.05, reg_lambda: 2.0, n_jobs: 2}}
  CatBoost: {type: catboost, params: {iterations: 900, learning_rate: 0.04, depth: 7, l2_leaf_reg: 5.0, thread_count: 2}}
  OOF Stacking: {type: stacking, estimators: [ExtraTrees, HistGradientBoosting, LightGBM], cv: 3, passthrough: true, scale_meta: true, final_estimator: {type: logistic_regression, params: {C: 0.5, max_iter: 3000}}}
weighted_voting:
  Weighted Soft Voting: {estimators: [ExtraTrees, HistGradientBoosting, XGBoost, LightGBM, CatBoost]}
reported:
  test:
    Weighted Soft Voting: {accuracy: 0.8672, precision: 0.5958, recall: 0.1449, f1: 0.2330, roc_auc: 0.8307, mcc: 0.2468}
  validation:
    CatBoost: {roc_auc: 0.8286}
    XGBoost: {roc_auc: 0.8285}
    HistGradientBoosting: {roc_auc: 0.8285}
    LightGBM: {roc_auc: 0.8282}
    ExtraTrees: {roc_auc: 0.7962}
